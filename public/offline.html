<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFD54F">
    <title>Sedang Offline — DuitMoo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: #FFF9EB;
            color: #263238;
            font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #FFFFFF;
            border: 3px solid #263238;
            border-radius: 24px;
            box-shadow: 0 8px 0 #263238;
            padding: 2rem;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #FFD54F;
            border: 2px solid #263238;
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 900; margin: 0 0 0.75rem; }
        p { font-size: 0.9rem; line-height: 1.6; color: #475569; margin: 0 0 1.5rem; }
        button {
            background: #407BFF;
            color: #FFFFFF;
            border: 3px solid #263238;
            border-radius: 14px;
            box-shadow: 0 4px 0 #263238;
            padding: 0.75rem 1.5rem;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            min-height: 44px;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">MODE OFFLINE</span>
        <h1>Koneksi Internet Terputus</h1>
        <p>
            Pencatatan dan pembacaan data keuangan DuitMoo membutuhkan koneksi aktif ke server agar saldo dan anggaran tetap akurat serta aman.
        </p>
        <button type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
    </main>
</body>
</html>
